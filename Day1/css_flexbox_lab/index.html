<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="cards">
        <section class="card vertical">
            <div class="profile">
                <img class="profile_image" src="https://randomuser.me/api/portraits/men/32.jpg" alt="John Guy">
                <h2 class="profile_name">John Shoshone</h2>
            </div>  

            <div class="rating">
                <img class = "rating_stars" src="https://i.imgur.com/iUpkmhs.png" alt="4 out of 5 stars">
                <p class="job_text">Psychic Healer</p>
            </div>

            <div class="price">
                <strong>5 min free</strong>
                <span>then 5.99 / min</span>
            </div>

            <div class = "actions">
                <div class="actions_call">C</div>
                <div class="actions_msg">M</div>
            </div>
        </section>
    </main>
</body>
</html>
